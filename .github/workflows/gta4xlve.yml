name: Galaxy Tab S6 Lite 2022 Wi-Fi & LTE (SM-P613/SM-P619) Build

on:
  workflow_dispatch:
    inputs:
      TRIGGER_ROM:
        description: "Trigger QuantumROM build upon completion? (True/False)"
        required: false
        default: "True"
      PUBLISH_RELEASE:
        description: "Publish official release to SourceForge & update OTA? (True/False)"
        required: false
        default: "False"
  repository_dispatch:
    types: [build-kernel]

jobs:
  build:
    name: Build Kernel (LineageOS Logic)
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Debug token length (temporary)
        run: echo "SYNC_PUSH_TOKEN length is ${#SYNC_PUSH_TOKEN}"
        env:
          SYNC_PUSH_TOKEN: ${{ secrets.SYNC_PUSH_TOKEN }}

      - name: Check and Merge Upstream Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/AlfCraft07/android_kernel_samsung_sm7125.git || true
          git fetch upstream oneui/android16

          UPSTREAM_COMMIT=$(git rev-parse upstream/oneui/android16)
          echo "Upstream oneui/android16 is at $UPSTREAM_COMMIT"

          if ! git merge-base --is-ancestor upstream/oneui/android16 HEAD; then
            echo "Upstream has new changes! Merging upstream/oneui/android16..."
            git merge upstream/oneui/android16 --no-edit -m "ci: sync upstream updates from AlfCraft07 [skip ci]"
            # NOTE: the default GITHUB_TOKEN (contents: write) cannot push changes
            # to .github/workflows/*.yml. If upstream touches workflow files, this
            # push will be rejected. Set the SYNC_PUSH_TOKEN secret to a fine-grained
            # PAT with "Contents: write" + "Workflows: write" on this repo to allow it.
            # This step now fails the job on a rejected push instead of hiding it,
            # so "sync succeeded" in the UI actually means the push landed.
            git push "https://x-access-token:${SYNC_PUSH_TOKEN:-$GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:oneui/android16
          else
            echo "Local branch is already up to date with upstream."
          fi
        env:
          SYNC_PUSH_TOKEN: ${{ secrets.SYNC_PUSH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # CACHING: Saves time by not re-downloading Clang every run
      # -----------------------------------------------------------------------
      - name: Cache Proton Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ~/toolchains/clang
          key: ${{ runner.os }}-proton-clang-v1

      - name: Setup Proton Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/toolchains
          echo "Cloning Proton Clang..."
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 ~/toolchains/clang

      # -----------------------------------------------------------------------
      # DEPENDENCIES: Standard build tools required by kernel.mk
      # -----------------------------------------------------------------------
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache cpio flex git kmod \
            libncurses5-dev libssl-dev rsync zip unzip wget curl ca-certificates dwarves \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu device-tree-compiler libelf-dev

      # -----------------------------------------------------------------------
      # KERNELSU-NEXT: Using Legacy Setup Script
      # -----------------------------------------------------------------------
      - name: Setup KernelSU-Next
        run: |
          echo "=========================================="
          echo "KernelSU-Next Setup (Legacy)"
          echo "=========================================="
          
          # Download and run KernelSU-Next legacy setup script
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/legacy/kernel/setup.sh" | bash -s legacy
          
          # --------------------------------------------------------------
          # Compatibility patches applied on top of the freshly-pulled,
          # unpinned KernelSU-Next `legacy` source. Each patch is idempotent:
          # it only rewrites the file if its target string is still present,
          # and hard-fails the build if not, instead of silently no-op'ing
          # (previous no-op behavior is exactly how the sucompat.c/
          # hook_manager.c patches went stale and unnoticed).
          # --------------------------------------------------------------
          python3 - <<'PYEOF'
          import sys

          def patch(path, old, new, label):
              with open(path) as f:
                  content = f.read()
              if old not in content:
                  print(f"::error::[{label}] target string not found in {path} - "
                        f"KernelSU-Next source has changed upstream, patch needs review")
                  sys.exit(1)
              with open(path, "w") as f:
                  f.write(content.replace(old, new))
              print(f"[{label}] applied to {path}")

          # This vendor's 4.14.357 tree only exposes ktime_get_boottime_ts64()/
          # get_monotonic_boottime64(); it does NOT define the plain
          # get_monotonic_boottime() that KernelSU-Next's own
          # "#if KERNEL_VERSION(4,19,0) <= LINUX_VERSION_CODE" check falls back
          # to on pre-4.19-numbered kernels. Force the modern call unconditionally.
          patch(
              "KernelSU-Next/kernel/sulog/event.c",
              "get_monotonic_boottime(&ts)",
              "ktime_get_boottime_ts64(&ts)",
              "event.c timespec64",
          )

          # NOTE: the ksu_input_hook injection patch (ksud_integration.c) and the
          # sucompat.c / hook_manager.c NULL-guard patches have been removed.
          # As of KernelSU-Next commit f6a1570c ("legacy: non-GKI update..."),
          # ksu_input_hook is already defined unconditionally in every hook mode,
          # so re-injecting it causes "redefinition of 'ksu_input_hook'". The
          # sucompat.c/hook_manager.c patches targeted call shapes that no longer
          # exist after that same refactor (functions were restructured), so they
          # had already become silent no-ops. If a future upstream change
          # reintroduces the need for any of these, the idempotent `patch()`
          # helper above will fail loudly rather than silently doing nothing or
          # silently duplicating a definition - add it back here if that happens.
          PYEOF
          
          echo "=========================================="
          echo "✓ KernelSU-Next setup complete"
          echo "=========================================="

      - name: Setup AnyKernel3
        run: |
          git clone --depth=1 https://github.com/AlfCraft07/AnyKernel3.git ~/AnyKernel3
          cd ~/AnyKernel3
          cat > anykernel.sh << 'EOF'
          #!/sbin/sh
          # AnyKernel3 Script for GTA4XLVE
          
          ## AnyKernel setup
          # begin properties
          properties() { '
          kernel.string=Legion Kernel for atoll platform - Built for gta4xlveu (SM-P613/SM-P619)
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=gta4xlve
          device.name2=gta4xl
          device.name3=SM-P613
          device.name4=gta4xlveu
          device.name5=SM-P619
          supported.versions=11-16
          supported.patchlevels=
          '; } # end properties
          
          ## AnyKernel boot install
          # begin attributes
          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          
          # boot header version 2 for this device
          boot_img_hdr_ver=2
          # end attributes
          
          ## AnyKernel methods (DO NOT CHANGE)
          # import patching functions/variables - see for reference
          . tools/ak3-core.sh;
          
          ## AnyKernel boot install
          split_boot; # use split_boot to extract ramdisk and kernel
          
          # Install kernel image
          flash_boot;
          ## end boot install
          EOF
          chmod +x anykernel.sh

      # -----------------------------------------------------------------------
      # BUILD LOGIC: Extracted directly from LineageOS kernel.mk
      # -----------------------------------------------------------------------
      - name: Compile Kernel
        run: |
          # 1. Setup Environment Variables (mimicking BoardConfig.mk)
          export PATH=~/toolchains/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE64=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # Flags found in kernel.mk
          export LLVM=1
          export LLVM_IAS=1
          
          # 2. Clean
          rm -rf out && mkdir -p out

          # 3. Build Base Config (TARGET_KERNEL_CONFIG)
          echo "--> Generating Base Config: vendor/samsung/sm7125_defconfig"
          make O=out vendor/samsung/sm7125_defconfig

          # 4. Merge Fragment (The 'kernel.mk' Logic)
          echo "--> Merging Fragment: arch/arm64/configs/vendor/samsung/gta4xlve.config"
             # This is the exact script Lineage uses to merge configs
             scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/samsung/gta4xlve.config
             make O=out olddefconfig

          # 5. Compile (KERNEL_MAKE_CMD)
          # For devices with CONFIG_BUILD_ARM64_DT_OVERLAY=y (overlay mode):
          # - Build Image.gz (not Image.gz-dtb) to avoid dtbs dependency
          # - Image.gz-dtb depends on 'dtbs' target which tries to build overlays
          # - Overlays are applied by bootloader at runtime, not appended to kernel
          # - This follows LineageOS methodology for overlay-enabled devices
          
          echo "--> Building kernel..."
          echo "--> Compiling Image.gz..."
          set -o pipefail
          make O=out -j$(nproc) Image.gz 2>&1 | tee build.log
          BUILD_STATUS=$?
          
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "Build failed with status $BUILD_STATUS"
            echo "==================== COMPILER ERRORS ===================="
            grep -i -n -E "error:|fatal error:|undefined reference" build.log -B 2 -A 5 || true
            echo "=========================================================="
            echo "Last 100 lines of build log:"
            tail -100 build.log
            exit $BUILD_STATUS
          fi

      # -----------------------------------------------------------------------
      # PACKAGING: AnyKernel3
      # -----------------------------------------------------------------------
      - name: Create Flashable ZIP
        run: |
          cd ~/AnyKernel3
          rm -rf .git* README.md
          
          # Create custom README for the ZIP
          cat > README.md << 'EOF'
          # Legion Kernel for atoll
          
          ## What's Included
          - Legion Kernel for atoll platform with 5.10 BPF backports
          - Image.gz - Kernel image for overlay-enabled device
          - AnyKernel3 flasher script
          
          ## How to Flash
          
          ### LineageOS Users (No TWRP needed!)
          1. Boot into LineageOS Recovery (Vol Up + Power)
          2. Navigate: Apply update → Apply from ADB
          3. On PC: `adb sideload legion-gta4xlve-YYYYMMDD.zip`
          4. Reboot and enjoy!
          
          ### TWRP/OrangeFox Users
          1. Boot into TWRP/OrangeFox recovery
          2. Flash this ZIP file
          3. Reboot and enjoy!
          
          ## Device Compatibility
          - Samsung Galaxy Tab S6 Lite 2022 Wi-Fi & LTE (SM-P613/SM-P619), Galaxy A52 4G (SM-A525F), Galaxy A72 4G (SM-A725F)
          - Models: gta4xlve, gta4xlvewifi, a52q, a72q
          - Android 11-16 / LineageOS 18-23
          
          ## Credits
          - @IamKavy47 for the script
          - @frostg-012 for the kernel
          
          ---
          EOF
          
          # Copy Artifacts
          # For overlay-enabled devices, use Image.gz (overlays applied by bootloader)
          if [ -f $GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz ]; then
             cp $GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz .
             echo "✓ Copied Image.gz"
          else
             echo "Build Failed: Image.gz not found"
             exit 1
          fi
          
          # Verify package contents
          echo "Package contents:"
          ls -lah
          
          # Create ZIP
          ZIPNAME="legion-gta4xlve-$(date +%Y%m%d).zip"
          zip -r9 $GITHUB_WORKSPACE/$ZIPNAME *
          echo "✓ Created $ZIPNAME"
          echo "ZIPNAME=$ZIPNAME" >> $GITHUB_ENV

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: gta4xlve
          path: ${{ env.ZIPNAME }}

      - name: Publish AnyKernel Release
        uses: softprops/action-gh-release@v2
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: kernel-latest
          name: "GTA4XLVE AnyKernel3 Latest"
          files: ${{ env.ZIPNAME }}
          draft: false
          prerelease: false

      - name: Trigger QuantumROM Build
        if: success()
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN || secrets.GH_TOKEN }}
          TRIGGER_ROM: ${{ github.event.inputs.TRIGGER_ROM || github.event.client_payload.trigger_rom || 'true' }}
          EVENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          INPUT_PUBLISH_RELEASE: ${{ github.event.inputs.PUBLISH_RELEASE }}
        run: |
          if [ "$TRIGGER_ROM" = "true" ] || [ "$TRIGGER_ROM" = "True" ]; then
            if [ -n "$GIT_TOKEN" ]; then
              echo "🚀 Dispatching event to QuantumROM repository with all properties..."
              python3 .github/scripts/dispatch_rom.py
            fi
          fi

      - name: Upload Build Log (Debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
