name: Galaxy Tab S6 Lite 2022 Wi-Fi & LTE (SM-P613/SM-P619) Build

on:
  repository_dispatch:
    types: [build-kernel]

  workflow_dispatch:
    inputs:
      TRIGGER_ROM:
        description: "Trigger QuantumROM build upon completion? (True/False)"
        required: true
        default: "True"

  push:
    branches: [ "oneui/android16", "main", "master", "copilot/**" ]

jobs:
  build:
    name: Build Kernel (LineageOS Logic)
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # -----------------------------------------------------------------------
      # CACHING: Saves time by not re-downloading Clang every run
      # -----------------------------------------------------------------------
      - name: Cache Proton Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ~/toolchains/clang
          key: ${{ runner.os }}-proton-clang-v1

      - name: Setup Proton Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/toolchains
          echo "Cloning Proton Clang..."
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 ~/toolchains/clang

      # -----------------------------------------------------------------------
      # DEPENDENCIES: Standard build tools required by kernel.mk
      # -----------------------------------------------------------------------
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache cpio flex git kmod \
            libncurses5-dev libssl-dev rsync zip unzip wget curl ca-certificates \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu device-tree-compiler

      # -----------------------------------------------------------------------
      # KERNELSU-NEXT: Using Legacy Setup Script
      # -----------------------------------------------------------------------
      - name: Setup KernelSU-Next
        run: |
          echo "=========================================="
          echo "KernelSU-Next Setup (Legacy)"
          echo "=========================================="
          
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/legacy/kernel/setup.sh" | bash -s legacy
          
          # Fix timespec64 pointer mismatch in sulog/event.c for 4.14 kernels
          python3 -c "p = 'KernelSU-Next/kernel/sulog/event.c'; content = open(p).read(); open(p, 'w').write(content.replace('get_monotonic_boottime(&ts)', 'ktime_get_boottime_ts64(&ts)'))"
          
          # Fix undefined ksu_input_hook symbol in ksud_integration.c for kprobes mode
          python3 -c "p = 'KernelSU-Next/kernel/runtime/ksud_integration.c'; content = open(p).read(); open(p, 'w').write(content.replace('static struct work_struct __maybe_unused stop_input_hook_work;', 'static struct work_struct __maybe_unused stop_input_hook_work;\nbool ksu_input_hook __read_mostly = true;'))"
          
          # Fix NULL pointer dereference in ksu_handle_execve_sucompat
          python3 -c "p = 'KernelSU-Next/kernel/feature/sucompat.c'; content = open(p).read(); open(p, 'w').write(content.replace('const char __user *const __user *argv_user = (const char __user *const __user *)PT_REGS_PARM2(regs);', 'const char __user *const __user *argv_user = regs ? (const char __user *const __user *)PT_REGS_PARM2(regs) : NULL;'))"
          python3 -c "p = 'KernelSU-Next/kernel/hook/hook_manager.c'; content = open(p).read(); open(p, 'w').write(content.replace('ksu_handle_execve_sucompat(filename_user, NULL, NULL);', 'ksu_handle_execve_sucompat(filename_user, id, regs);'))"
          
          echo "=========================================="
          echo "✓ KernelSU-Next setup complete"
          echo "=========================================="

      # -----------------------------------------------------------------------
      # BUILD LOGIC: Extracted directly from LineageOS kernel.mk
      # -----------------------------------------------------------------------
      - name: Compile Kernel
        run: |
          export PATH=~/toolchains/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE64=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          export LLVM=1
          export LLVM_IAS=1
          
          rm -rf out && mkdir -p out

          echo "--> Generating Base Config: vendor/samsung/sm7125_defconfig"
          make O=out vendor/samsung/sm7125_defconfig

          echo "--> Merging Fragment: arch/arm64/configs/vendor/samsung/gta4xlve.config"
          scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/samsung/gta4xlve.config
          make O=out olddefconfig

          echo "--> Building kernel..."
          echo "--> Compiling Image.gz and dtbo.img..."
          set -o pipefail
          make O=out -j$(nproc) Image.gz dtbo.img 2>&1 | tee build.log || make O=out -j$(nproc) Image.gz 2>&1 | tee build.log
          BUILD_STATUS=$?
          
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "Build failed with status $BUILD_STATUS"
            tail -100 build.log
            exit $BUILD_STATUS
          fi

      # -----------------------------------------------------------------------
      # PACKAGING: Pure Kernel Artifacts (Image.gz & dtbo.img)
      # -----------------------------------------------------------------------
      - name: Prepare Kernel Artifacts
        run: |
          mkdir -p $GITHUB_WORKSPACE/artifacts
          
          if [ -f $GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz ]; then
             cp $GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz $GITHUB_WORKSPACE/artifacts/Image.gz
             echo "✓ Copied Image.gz"
          else
             echo "Build Failed: Image.gz not found"
             exit 1
          fi

          if [ -f $GITHUB_WORKSPACE/out/arch/arm64/boot/dtbo.img ]; then
             cp $GITHUB_WORKSPACE/out/arch/arm64/boot/dtbo.img $GITHUB_WORKSPACE/artifacts/dtbo.img
             echo "✓ Copied dtbo.img"
          fi

          echo "Artifacts ready:"
          ls -lah $GITHUB_WORKSPACE/artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: kernel-latest
          name: "SM7125 GTA4XLVE Kernel Latest"
          files: ${{ github.workspace }}/artifacts/*
          draft: false
          prerelease: false

      - name: Trigger QuantumROM Build (Zero-Idle Handoff)
        if: success()
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN || secrets.GH_TOKEN }}
        run: |
          if [ -n "$GIT_TOKEN" ]; then
            echo "🚀 Dispatching event to QuantumROM repository..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: token $GIT_TOKEN" \
              "https://api.github.com/repos/tui2019/QuantumROM/dispatches" \
              -d '{
                "event_type": "kernel-build-completed",
                "client_payload": {
                  "stock_device": "SM-P613",
                  "target_device": "SM-P620",
                  "target_csc": "EUX",
                  "output_fs": "erofs"
                }
              }')

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "✅ QuantumROM successfully triggered!"
            else
              echo "❌ Failed to trigger QuantumROM repository dispatch. HTTP Code: $HTTP_CODE"
            fi
          else
            echo "ℹ️ No GIT_TOKEN found. Skipping QuantumROM trigger."
          fi

      - name: Upload Build Log (Debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
